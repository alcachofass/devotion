name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Update package manager
        run: sudo apt-get update

      - name: Build QVM
        run: make -j$(nproc)
        env:
          ARCHIVE: 1

      - name: Generate artifact metadata
        id: metadata
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            GIT_DESCRIBE=$(git describe --tags --always)
            ARTIFACT_NAME="devotion-${GIT_DESCRIBE}"
          else
            ARTIFACT_NAME="devotion-development"
          fi
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          sha256sum build/*.pk3 > build/SHA256SUMS
          ls -la build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            build/*.pk3
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.pk3
            build/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: false

      - name: Publish development release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: development
          target_commitish: ${{ github.sha }}
          name: Development
          body: |
            Development build from `${{ github.ref_name }}` at `${{ github.sha }}`.

            This prerelease is generated automatically from every branch push.
          files: |
            build/*.pk3
            build/SHA256SUMS
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
